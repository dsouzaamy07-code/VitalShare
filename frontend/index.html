<!doctype html><nhtml lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VitalShare</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{--r:#bd263b;--d:#85182b;--ink:#29252b;--muted:#77727a;--line:#eee5e6;--bg:#fff8f7;--pink:#fdebed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}.top{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:3}.brand{font:800 23px Manrope;color:var(--d)}.brand b{background:var(--r);color:white;padding:7px 10px;border-radius:10px;margin-right:8px}.shell{display:flex;min-height:calc(100vh - 72px)}aside{width:220px;background:white;border-right:1px solid var(--line);padding:24px 14px}.nav{display:block;width:100%;padding:12px;margin:4px 0;border:0;border-radius:9px;background:white;text-align:left;color:#625b63;cursor:pointer}.nav.active,.nav:hover{background:var(--pink);color:var(--d);font-weight:700}.main{padding:34px;max-width:1300px;width:100%;margin:auto}.eyebrow{font-size:11px;color:var(--r);font-weight:700;letter-spacing:1.5px;text-transform:uppercase}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.heading h1{font:800 32px Manrope;margin:8px 0}.sub,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 12px 32px #6e18200c;margin-bottom:18px}.stat{font:800 30px Manrope}.btn{border:0;border-radius:9px;background:var(--r);color:white;padding:11px 16px;font-weight:700;cursor:pointer}.btn.secondary{background:white;color:var(--d);border:1px solid #e8cbd0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}label{font-size:13px;font-weight:700}input,select{padding:11px;border:1px solid #e2dadd;border-radius:8px;font:inherit;width:100%}.full{grid-column:1/-1}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:600px}td,th{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:11px;color:var(--muted);text-transform:uppercase}.pill{background:var(--pink);color:var(--d);border-radius:20px;padding:4px 8px;font-size:11px}.notice{padding:12px;background:#fff3df;color:#79511c;border-radius:9px;margin:14px 0;font-size:13px}.auth{max-width:650px;margin:45px auto;padding:0 15px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;right:20px;background:#29252b;color:white;padding:14px;border-radius:9px;display:none;max-width:380px;z-index:5}.section{margin-top:24px}@media(max-width:760px){.shell{display:block}aside{width:100%;display:flex;overflow:auto;padding:8px}.nav{white-space:nowrap;width:auto}.main{padding:20px 14px}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.heading{display:block}}
</style></head><body><header class="top"><div class="brand"><b>♥</b>VitalShare</div><span class="muted">Give blood. Share life.</span><button class="btn secondary hidden" id="logout" onclick="logout()">Sign out</button></header>
<div id="auth" class="auth card"><div class="eyebrow">A little help can save a life</div><h1>Create your VitalShare profile</h1><p class="sub">Register a user and, optionally, a donor profile.</p><div class="notice">The selected backend has no login/authentication endpoint. This form creates records only; it does not provide secure sign-in yet.</div><form id="reg"><div class="formgrid"><div class="field full"><label>Full name</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password (temporary field)</label><input id="password" type="password" minlength="8" required></div><div class="field"><label>Role</label><select id="role"><option>DONOR</option><option>REQUESTER</option><option>BOTH</option></select></div><div class="field"><label>Blood group</label><select id="bg"><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div><div class="field"><label>Date of birth</label><input id="dob" type="date"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>City</label><input id="city"></div><div class="field"><label>Area</label><input id="area"></div><div class="field"><label>Pincode</label><input id="pin"></div><div class="field full"><label><input id="consent" type="checkbox" style="width:auto"> I consent to being contacted about donation requests.</label></div></div><button class="btn" style="width:100%;margin-top:18px">Create account</button></form></div>
<div id="app" class="shell hidden"><aside><button class="nav active" data-page="dashboard">⌂ Dashboard</button><button class="nav" data-page="donors">♡ Find donors</button><button class="nav" data-page="requests">＋ Blood requests</button><button class="nav" data-page="matches">✳ Donor matches</button><button class="nav" data-page="donations">▤ Donations</button><button class="nav" data-page="eligibility">✓ Eligibility</button><button class="nav" data-page="profile">◉ My profile</button></aside><main class="main" id="main"></main></div><div id="toast" class="toast"></div>
<script>
const API=(localStorage.getItem('vs_api')||'http://localhost:8080').replace(/\/$/,'');const GROUP_IDS={'A+':1,'A-':2,'B+':3,'B-':4,'AB+':5,'AB-':6,'O+':7,'O-':8};let user=JSON.parse(localStorage.getItem('vs_user')||'null'),donor=JSON.parse(localStorage.getItem('vs_donor')||'null');const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4500)}async function api(path,opt={}){let r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opt}),t=await r.text(),d=t?(()=>{try{return JSON.parse(t)}catch{return t}})():null;if(!r.ok)throw Error(typeof d==='string'?d:d?.message||`HTTP ${r.status}`);return d}
$('reg').onsubmit=async e=>{
    e.preventDefault();

    showApp();
    return;

    try{let u=await api('/api/users',{method:'POST',body:JSON.stringify({fullName:$('name').value,email:$('email').value,passwordHash:$('password').value,role:$('role').value})});user=u;localStorage.setItem('vs_user',JSON.stringify(u));if($('bg').value&&['DONOR','BOTH'].includes($('role').value)){let id=GROUP_IDS[$('bg').value];if(!id)throw Error('Configure blood group IDs after checking the database.');donor=await api('/api/donors',{method:'POST',body:JSON.stringify({user:{userId:u.userId},bloodGroup:{bloodGroupId:id},dateOfBirth:$('dob').value||null,phone:$('phone').value,city:$('city').value,area:$('area').value,pincode:$('pin').value,isAvailable:true,consentToContact:$('consent').checked})});localStorage.setItem('vs_donor',JSON.stringify(donor))}toast('User record created. Authentication is not implemented yet.');showApp()}catch(x){toast('Registration failed: '+x.message)}};
function showApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');render('dashboard')}function logout(){localStorage.removeItem('vs_user');localStorage.removeItem('vs_donor');user=donor=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('logout').classList.add('hidden')}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.page)});function head(k,t,s){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p class="sub">${s}</p></div></div>`}function f(l,id,type='text',req=true){return `<div class="field"><label>${l}</label><input id="${id}" type="${type}" ${req?'required':''}></div>`}function sel(l,id,opts){return `<div class="field"><label>${l}</label><select id="${id}" required>${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></div>`}function table(h,rows){return `<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${h.length}">No records found</td></tr>`}</tbody></table></div>`}
async function render(p){let m=$('main');try{if(p==='dashboard'){let a=await Promise.allSettled([api('/api/donors'),api('/api/blood-requests/open'),api('/api/donations')]);let vals=a.map(x=>x.status==='fulfilled'?x.value.length:'—');m.innerHTML=head('YOUR IMPACT','Welcome to VitalShare','Connect people who need blood with people who can donate.')+`<div class="grid"><div class="card"><div class="muted">Registered donors</div><div class="stat">${vals[0]}</div></div><div class="card"><div class="muted">Open requests</div><div class="stat">${vals[1]}</div></div><div class="card"><div class="muted">Donation records</div><div class="stat">${vals[2]}</div></div></div><div class="card section"><h3>Make a difference today</h3><button class="btn" onclick="render('requests')">Create blood request</button> <button class="btn secondary" onclick="render('donors')">Find donors</button></div>`}
if(p==='donors'){m.innerHTML=head('DONOR DIRECTORY','Find donors','Search by city, pincode or blood group.')+`<div class="card"><div class="formgrid">${f('City','scity','text',false)}${f('Pincode','spin','text',false)}${sel('Blood group','sgroup',[['','Any group'],...Object.entries(GROUP_IDS).map(([k,v])=>[v,k])])}</div><button class="btn" onclick="searchDonors()">Search</button></div><div id="results" class="section"></div>`}
if(p==='requests'){m.innerHTML=head('COMMUNITY NEEDS','Blood requests','Create a request and review open requests.')+`<div class="card"><h3>New blood request</h3><form id="rf"><div class="formgrid">${f('Requester user ID','ruid','number')}${sel('Blood group','rbg',[['','Select'],...Object.entries(GROUP_IDS).map(([k,v])=>[v,k])])}${f('Hospital','hospital')}${f('City','rcity')}${f('Area','rarea')}${f('Pincode','rpin')}${f('Units required','units','number')}${f('Required by','required','datetime-local')}${sel('Urgency','urg',[['','Select'],['CRITICAL','Critical'],['URGENT','Urgent'],['NORMAL','Normal']])}</div><button class="btn" style="margin-top:16px">Submit request</button></form></div><div class="section" id="rlist"></div>`;$('rf').onsubmit=createRequest;loadRequests()}
if(p==='matches'){m.innerHTML=head('SMART MATCHING','Donor matches','Generate suggestions for an open blood request.')+`<div class="card">${f('Blood request ID','mid','number')}<button class="btn" onclick="matches()">Generate matches</button></div><div id="mresults"></div>`}
if(p==='donations'){m.innerHTML=head('DONATION RECORDS','Donations','Record and view donations.')+`<div class="card"><form id="df"><div class="formgrid">${f('Donor ID','did','number')}${f('Donation date','ddate','date')}${sel('Donation type','dtype',[['','Select'],['WHOLE_BLOOD','Whole blood'],['PLASMA','Plasma'],['PLATELETS','Platelets']])}${sel('Status','dstatus',[['COMPLETED','Completed'],['SCHEDULED','Scheduled'],['CANCELLED','Cancelled']])}</div><button class="btn" style="margin-top:15px">Save donation</button></form></div><div id="dlist"></div>`;$('df').onsubmit=createDonation;loadDonations()}
if(p==='eligibility'){m.innerHTML=head('DONOR WELLBEING','Check eligibility','Uses the backend donation history and active eligibility rules.')+`<div class="card"><form id="ef"><div class="formgrid">${f('Donor ID','eid','number')}${sel('Donation type','etype',[['','Select'],['WHOLE_BLOOD','Whole blood'],['PLASMA','Plasma'],['PLATELETS','Platelets']])}</div><button class="btn" style="margin-top:15px">Check eligibility</button></form><div id="eres"></div></div>`;$('ef').onsubmit=eligibility}
if(p==='profile'){m.innerHTML=head('YOUR ACCOUNT','My profile','Details saved in this browser session.')+`<div class="card"><p><b>Name:</b> ${esc(user?.fullName)}</p><p><b>Email:</b> ${esc(user?.email)}</p><p><b>User ID:</b> ${esc(user?.userId)}</p><p><b>Role:</b> ${esc(user?.role)}</p><h3>Donor record</h3><pre>${esc(JSON.stringify(donor,null,2)||'No donor profile')}</pre></div>`}}
catch(e){m.innerHTML=head('BACKEND CONNECTION','Could not load data','Check that Spring Boot is running on '+API)+`<div class="notice">${esc(e.message)}</div>`}}
async function searchDonors(){try{let c=$('scity').value,p=$('spin').value,g=$('sgroup').value,path=c?'/api/donors/city/'+encodeURIComponent(c):p?'/api/donors/pincode/'+encodeURIComponent(p):g?'/api/donors/blood-group/'+g:'/api/donors',d=await api(path);$('results').innerHTML=table(['ID','Name','Blood group','City','Phone','Available'],d.map(x=>`<tr><td>${x.donorId}</td><td>${esc(x.user?.fullName)}</td><td>${esc(x.bloodGroup?.bloodGroupName||x.bloodGroup?.bloodGroupId)}</td><td>${esc(x.city)}</td><td>${esc(x.phone)}</td><td>${x.isAvailable?'Yes':'No'}</td></tr>`))}catch(e){toast(e.message)}}
async function loadRequests(){try{let d=await api('/api/blood-requests/open');$('rlist').innerHTML=table(['ID','Blood group','Hospital','City','Units','Urgency','Status',''],d.map(x=>`<tr><td>${x.requestId}</td><td>${esc(x.bloodGroup?.bloodGroupName||x.bloodGroup?.bloodGroupId)}</td><td>${esc(x.hospitalName)}</td><td>${esc(x.city)}</td><td>${x.unitsRequired}</td><td>${esc(x.urgency)}</td><td>${esc(x.status)}</td><td><button class="btn secondary" onclick="goMatches(${x.requestId})">Match</button></td></tr>`))}catch(e){$('rlist').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
async function createRequest(e){e.preventDefault();try{await api('/api/blood-requests',{method:'POST',body:JSON.stringify({requester:{userId:+$('ruid').value},bloodGroup:{bloodGroupId:+$('rbg').value},hospitalName:$('hospital').value,city:$('rcity').value,area:$('rarea').value,pincode:$('rpin').value,unitsRequired:+$('units').value,requiredBy:$('required').value,urgency:$('urg').value,status:'OPEN'})});toast('Request created');e.target.reset();loadRequests()}catch(x){toast(x.message)}}function goMatches(id){document.querySelector('[data-page="matches"]').click();setTimeout(()=>$('mid').value=id,50)}
async function matches(){try{let d=await api('/api/donor-matches/generate/'+$('mid').value,{method:'POST'});$('mresults').innerHTML=table(['Match ID','Donor','City','Status'],d.map(x=>`<tr><td>${x.matchId}</td><td>${esc(x.donor?.user?.fullName)}</td><td>${esc(x.donor?.city)}</td><td>${esc(x.matchStatus)}</td></tr>`))}catch(e){toast(e.message)}}async function createDonation(e){e.preventDefault();try{await api('/api/donations',{method:'POST',body:JSON.stringify({donor:{donorId:+$('did').value},donationDate:$('ddate').value,donationType:$('dtype').value,status:$('dstatus').value})});toast('Donation saved');loadDonations()}catch(x){toast(x.message)}}async function loadDonations(){try{let d=await api('/api/donations');$('dlist').innerHTML=table(['ID','Donor','Date','Type','Status'],d.map(x=>`<tr><td>${x.donationId}</td><td>${x.donor?.donorId}</td><td>${esc(x.donationDate)}</td><td>${esc(x.donationType)}</td><td>${esc(x.status)}</td></tr>`))}catch(e){$('dlist').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}async function eligibility(e){e.preventDefault();try{let d=await api('/api/eligibility-rules/check/'+$('eid').value+'/'+$('etype').value);$('eres').innerHTML=`<div class="card"><span class="pill">${d.eligible?'ELIGIBLE':'NOT ELIGIBLE'}</span><h3>${esc(d.message)}</h3><p>Last donation: ${esc(d.lastDonationDate||'None recorded')}</p><p>Eligible again: ${esc(d.eligibleAgainFrom||'Now')}</p><p>Days remaining: ${d.daysRemaining}</p></div>`}catch(x){toast(x.message)}}if(user)showApp();
</script></body></html>
